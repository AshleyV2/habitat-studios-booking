# nginx on the host in front of the app container (published on 127.0.0.1:8080).
# Use this instead of the bundled Caddy: remove "caddy" from COMPOSE_PROFILES in .env.
# Set TRUST_PROXY=1 in .env.

server {
    listen 80;
    server_name www.habitatstudio.co.uk;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.habitatstudio.co.uk;
    ssl_certificate     /etc/letsencrypt/live/www.habitatstudio.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.habitatstudio.co.uk/privkey.pem;
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Serving under a path of the existing website instead (PUBLIC_URL=https://www.example-main-site.co.uk/book):
#   location /book/ { proxy_pass http://127.0.0.1:8080; ... same headers ... }
# The app keeps the /book prefix itself — do NOT strip it in the proxy.
