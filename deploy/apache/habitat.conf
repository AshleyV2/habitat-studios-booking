# Apache 2.4 on the host (a2enmod proxy proxy_http headers ssl). Set TRUST_PROXY=1.
<VirtualHost *:443>
    ServerName www.habitatstudio.co.uk
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/www.habitatstudio.co.uk/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/www.habitatstudio.co.uk/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
    LimitRequestBody 2097152
</VirtualHost>

# Under a path of the existing site (PUBLIC_URL=https://www.example-main-site.co.uk/book):
#   ProxyPass        /book/ http://127.0.0.1:8080/book/
#   ProxyPassReverse /book/ http://127.0.0.1:8080/book/
